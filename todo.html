<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111716">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Todo">
  <title>WorkerBee Todo</title>
  <link rel="manifest" href="/workerbee.webmanifest">
  <link rel="apple-touch-icon" href="/assets/workerbee-mark.svg">
  <link rel="icon" href="/assets/workerbee-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,600&family=Nunito:wght@400;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/workerbee.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body data-workerbee-surface="todo">
  <header class="wb-header todo-header">
    <a class="wb-brand" href="/todo"><img src="/assets/workerbee-mark.svg" alt=""><span><strong>Todo</strong><small>WorkerBee</small></span></a>
    <nav aria-label="WorkerBee pages"><a href="/dashboard">Dashboard</a><a class="active" href="/todo">Todo</a></nav>
    <button class="quiet-button" id="sign-out" type="button" hidden>Sign out</button>
  </header>

  <main class="todo-main">
    <section class="auth-card" id="auth-card">
      <p class="eyebrow">Private lists</p><h1>Sign in to your todo.</h1><p>Your headings and checkboxes stay private and synchronized.</p>
      <form id="auth-form"><label for="auth-email">Email</label><input id="auth-email" type="email" autocomplete="email" required><button class="primary-button" type="submit">Send sign-in link</button><p class="form-message" id="auth-message" role="status"></p></form>
    </section>
    <section id="loading" class="loading-card" hidden>Loading your lists...</section>
    <section id="error-card" class="error-card" hidden><h1>I could not open your todo.</h1><p id="error-message"></p></section>

    <div id="todo-app" hidden>
      <section class="todo-intro"><div><p class="eyebrow">Your lists</p><h1>What needs doing?</h1></div><button class="quiet-button" id="add-section" type="button"><i data-lucide="plus"></i> Add heading</button></section>
      <div id="todo-sections" class="todo-document"></div>
    </div>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="/js/workerbee.js"></script>
</body>
</html>
